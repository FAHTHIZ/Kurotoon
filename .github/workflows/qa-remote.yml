name: QA remote
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: How long to keep the emulator up
        default: "300"
permissions:
  contents: write
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Drive the emulator from the qa-cmd branch
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
          MINUTES: ${{ inputs.minutes }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          cores: 4
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: |
            adb wait-for-device
            adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done'
            adb shell settings put global window_animation_scale 0.5
            adb shell settings put global transition_animation_scale 0.5
            adb shell settings put global animator_duration_scale 0.5
            adb install -r -g $(ls app/build/outputs/apk/debug/*x86_64*.apk | head -1)
            adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher || true
            (adb logcat -v time > /tmp/logcat.txt 2>&1 &)
            python3 .github/qa/remote.py
